# 配信アーカイブのセリフ文字起こし → 検索インデックス生成
#
# YouTube Data API は一切呼ばないため追加クォータ消費は 0u。
# 既存の data-live.yml / data-contents.yml / data-report.yml は変更していない。
# public/data/** のみをコミットするため deploy.yml は起動しない（データ追加で再デプロイしない設計を維持）。
name: update-transcripts
on:
  schedule:
    # 1日1回。既存ワークフローと重ならない時刻(UTC 18:37)に実行
    - cron: "37 18 * * *"
  workflow_dispatch:
    inputs:
      videoId:
        description: "この1本だけ処理する videoId（空ならcronと同じバッチ処理）"
        required: false
        default: ""
      force:
        description: "既に処理済みでも再処理する"
        type: boolean
        required: false
        default: false
      whisperModel:
        description: "字幕が無い場合のWhisperモデル(tiny/base/small/medium)"
        required: false
        default: "small"
      retryFailed:
        description: "連続失敗で後回しにした動画も再挑戦する"
        type: boolean
        required: false
        default: false
      diagnose:
        description: "PO Token/プラグインの診断ログを出す（文字起こしは行わない）"
        type: boolean
        required: false
        default: false
concurrency:
  group: data-json-transcripts
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  transcripts:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # 長尺配信のWhisper処理を考慮(GitHubのジョブ上限は6h)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # yt-dlp のJSチャレンジ解決(EJS)にはJSランタイムが必要。
      # 下の setup-node より前にPythonだけ入れてもEJSは動かないため、
      # Node を先に用意してから yt-dlp を実行する構成にしている。
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Python deps
        run: |
          # [default] を付けると yt-dlp-ejs（JSチャレンジ解決スクリプト）が同梱される。
          # これが無いと "Requested format is not available" で失敗する。
          pip install -r scripts/requirements.txt
          # 回避策は頻繁に更新されるため yt-dlp は常に最新へ
          pip install -U "yt-dlp[default]"
          python -m yt_dlp --version
          node --version

      # PO Token プロバイダのサーバースクリプトを用意する。
      # 字幕が無く音声ダウンロードが必要な配信で "No video formats found!" になる問題への対策。
      # bgutil-ytdlp-pot-provider (Pythonプラグイン)は上のrequirements.txtで導入済みで、
      # ここでは対になるNode.js製のトークン生成スクリプト本体を $HOME 配下にビルドする。
      - name: Set up PO Token provider
        run: bash scripts/setup-pot.sh

      # YouTubeのボット判定対策(任意): Secret YT_COOKIES に Netscape形式の
      # cookies.txt の中身を入れておくと Cookie 付きで取得を試みる。
      # 未設定でも動作する（player_client の切り替えのみで試行）。
      - name: Prepare cookies (optional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "YT_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
            echo "cookies: enabled"
          else
            echo "cookies: not set (player_client fallback only)"
          fi

      - name: Install Node deps (minisearch / kuromoji)
        run: npm ci

      # 診断専用ステップ（diagnose=true のときだけ動く）。
      # 「サーバーは起きているのに formats が取れない」原因を切り分けるため、
      # yt-dlp 自身に何が起きているかを verbose で吐かせる。
      # 特に見たいのは -v ヘッダの "Extractor Plugins:" 行で、
      # ここに bgutil が出ていなければ、プラグインがロードされていない
      # （= サーバーを起動しても永久に PO Token は使われない）と確定できる。
      - name: Diagnose PO Token / plugin
        if: github.event.inputs.diagnose == 'true'
        run: |
          VID="${{ github.event.inputs.videoId || 'noOrRU6_h3I' }}"

          echo "===== 1. バージョン ====="
          python -m yt_dlp --version
          pip show bgutil-ytdlp-pot-provider | grep -E "^(Name|Version|Location)" || true

          echo "===== 2. プラグインとして認識されているか ====="
          # -v のヘッダに Extractor Plugins / Post-Processor Plugins が出る
          python -m yt_dlp -v --simulate --skip-download \
            "https://www.youtube.com/watch?v=$VID" 2>&1 \
            | grep -iE "plugin|python|yt-dlp version" | head -30 || true

          echo "===== 3. PO Token サーバーの応答 ====="
          curl -sS --max-time 5 http://127.0.0.1:4416/ping || true
          echo

          echo "===== 4. formats 取得の詳細（web_safari） ====="
          python -m yt_dlp -v --list-formats \
            --extractor-args "youtube:player_client=web_safari" \
            "https://www.youtube.com/watch?v=$VID" 2>&1 | tail -60 || true

          echo "===== 5. formats 取得の詳細（既定クライアント） ====="
          python -m yt_dlp -v --list-formats \
            "https://www.youtube.com/watch?v=$VID" 2>&1 | tail -60 || true

          # 上の4/5は Cookie 無しなので必ずボット判定に当たる。
          # 実際の transcribe.py は Cookie を渡しているため、
          # 「設定済みの Cookie がまだ有効か」をここで切り分ける。
          echo "===== 6. Cookie の状態 ====="
          if [ -n "${YT_COOKIES_FILE:-}" ] && [ -f "$YT_COOKIES_FILE" ]; then
            echo "cookie file: present ($(wc -l < "$YT_COOKIES_FILE") 行)"
            # 値そのものは出さない。ドメインと有効期限だけ確認する
            awk '!/^#/ && NF {print $1, $5}' "$YT_COOKIES_FILE" \
              | sort -u | head -10
            echo "--- 現在のUNIX時刻: $(date +%s) （上の第2列がこれより小さいものは期限切れ）"
          else
            echo "cookie file: NOT SET （シークレット YT_COOKIES が未設定）"
          fi

          echo "===== 7. Cookie 付きで formats を取得できるか（本命） ====="
          if [ -n "${YT_COOKIES_FILE:-}" ] && [ -f "$YT_COOKIES_FILE" ]; then
            python -m yt_dlp -v --list-formats \
              --js-runtimes node \
              --cookies "$YT_COOKIES_FILE" \
              "https://www.youtube.com/watch?v=$VID" 2>&1 | tail -40 || true
          else
            echo "(Cookie 未設定のためスキップ)"
          fi

      # 1) 文字起こし（cron=バッチ最大2本 / workflow_dispatch=指定1本）
      #    対象があったのに1本も成功しなかった場合（多くはYouTubeのボット判定）は
      #    exit 1 でこのステップを失敗させ、ジョブ全体を失敗として終了する。
      #    → GitHub Actionsの実行一覧に赤いXが付き、既定の通知設定なら失敗メールが届く。
      #    「自動実行が実は毎回失敗していたのに気づけない」を防ぐための仕組み。
      - name: Transcribe
        if: github.event.inputs.diagnose != 'true'
        id: transcribe
        run: |
          # PO Token プロバイダの生存確認。
          # ここが落ちていると yt-dlp は "No video formats found!" で失敗するが、
          # メタデータだけは取れるためネットワーク障害と見分けが付きにくい。
          # 先に明示的に確認して、原因を取り違えないようにする。
          if curl -sf --max-time 3 http://127.0.0.1:4416/ping >/dev/null; then
            echo "PO Token provider: alive"
          else
            echo "::error::PO Token provider (127.0.0.1:4416) が応答しません。字幕なし配信の音声取得は失敗します。"
            cat "$RUNNER_TEMP/bgutil-pot.log" || true
            exit 1
          fi

          if [ -n "${{ github.event.inputs.videoId }}" ]; then
            python scripts/transcribe.py \
              --video-id "${{ github.event.inputs.videoId }}" \
              --whisper-model "${{ github.event.inputs.whisperModel || 'small' }}" \
              ${{ github.event.inputs.force == 'true' && '--force' || '' }}
          else
            # CIは字幕がある配信のみ処理する(--subs-only)。
            # 字幕チェックは1本あたり十数秒で終わるため、多めに走査して
            # 「字幕がある配信」を確実に消化していく。字幕が無い配信は
            # needs-whisper.json に記録し、--recheck-days 経過後に再確認する
            # （YouTubeの自動字幕は後から生成されることがあるため）。
            #
            # 20本に増やしているのは、滞留していた約190本を消化するため。
            # 字幕経由は1本あたり十数秒なので20本でも数分で終わる。
            # 消化しきったら通常は1日数本しか対象が無いので実質的な負荷は増えない。
            python scripts/transcribe.py --subs-only --max 20 \
              ${{ github.event.inputs.retryFailed == 'true' && '--retry-failed' || '' }}
          fi

      # 2) 検索インデックスと人気セリフを再生成
      #    Transcribeが失敗していても、skipped.json/failures.json の記録は
      #    残したいので if: always() で必ず実行する（ジョブ自体は失敗のまま）。
      - name: Build search index / popular / quotes
        if: always() && github.event.inputs.diagnose != 'true'
        run: |
          node scripts/build-popular.mjs
          node scripts/build-quotes.mjs

      # 2.5) 新しく文字起こしできた配信を D1(検索データベース)へ反映する。
      #      これが無いと、文字起こしはできても検索に出てこない。
      #      ingested テーブルで投入済みを判定し、差分だけ入れる
      #      （D1無料枠は書き込み10万行/日。全件入れ直すと上限に当たる）。
      #      CLOUDFLARE_API_TOKEN が未設定なら黙ってスキップする（任意の機能）。
      - name: Sync to D1 (search database)
        if: always() && github.event.inputs.diagnose != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN 未設定のため D1 同期はスキップします"
            exit 0
          fi
          cd worker && npm ci --silent && cd ..

          # 投入済みの配信一覧を取り出す
          cd worker
          npx wrangler d1 execute otoile-search --remote --json \
            --command "SELECT vid FROM ingested" > /tmp/ingested.json || echo '[]' > /tmp/ingested.json
          cd ..
          node -e "
            const fs=require('fs');
            let rows=[];
            try{
              const j=JSON.parse(fs.readFileSync('/tmp/ingested.json','utf8'));
              rows=(Array.isArray(j)?j:[j]).flatMap(x=>x.results||[]);
            }catch{}
            fs.writeFileSync('/tmp/ingested-list.json', JSON.stringify(rows));
            console.log('already in D1:', rows.length, 'videos');
          "

          node scripts/build-d1-sql.mjs --ingested /tmp/ingested-list.json

          # 生成されたSQLを順に流し込む
          cd worker
          for f in ../out/d1/*.sql; do
            [ -e "$f" ] || continue
            echo "--- $f ---"
            npx wrangler d1 execute otoile-search --remote -y --file="$f"
          done

      # 3) public/data のみコミット（deploy.yml は paths-ignore で起動しない）
      - name: Commit if changed
        if: always() && github.event.inputs.diagnose != 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/data/transcripts public/data/popular.json public/data/quotes.json
          git diff --cached --quiet || git commit -m "chore(data): update transcripts/search index [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
            echo "push failed, retrying ($i)..."
            sleep $((RANDOM % 10 + 5))
          done
          exit 1

      # 4) 失敗を目立たせる（Transcribeが失敗していた場合、ここでジョブを再度失敗させる）
      #    なお「字幕が無くCIから音声を取得できない」ケースは想定内としてスクリプト側が
      #    正常終了(exit 0)するため、ここには到達しない = 毎日の無意味な失敗通知は出ない。
      #    ここに来るのはボット判定・環境不備・コード不具合など「対処が必要な異常」のみ。
      - name: Fail job if transcribe failed
        if: always() && steps.transcribe.outcome == 'failure'
        run: |
          echo "::error::文字起こしが異常終了しました。上のTranscribeステップのログを確認してください。"
          echo "::error::ボット判定の場合は Secret YT_COOKIES を更新、それ以外は手元PCで 'python scripts/transcribe.py --max 3' を実行してpushしてください。"
          exit 1
