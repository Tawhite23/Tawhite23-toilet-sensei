name = "otoile-live"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# AbortSignal.timeout / caches.default を素直に使うために有効化
compatibility_flags = ["nodejs_compat"]

# 無料プランのまま運用する。使用量が跳ねたら Cloudflare ダッシュボードで
# これらの数値を上げれば、再デプロイ無しで上流の呼び出し頻度を落とせる。
[vars]
YT_CHANNEL_ID = "UCmxpPhu7kAWWnoQ_cY0clTQ"
ALLOW_ORIGINS = "https://otoiresensei-pj.web.app,http://localhost:3000"

# --- サーバ側TTL(秒): 上流の YouTube API を叩く間隔 ---
LIVE_TTL_SEC = "60"
IDLE_TTL_SEC = "300"
STATS_TTL_SEC = "600"

# --- クライアント側のポーリング間隔(ミリ秒) ---
CLIENT_LIVE_POLL_MS = "60000"
CLIENT_IDLE_POLL_MS = "300000"

# --- /api/contents (動画/配信一覧の差分パッチ) ---
# ベースは data-contents.yml (6時間毎) が更新するこのリポジトリの完全な一覧。
# ここに直近 CONTENTS_PATCH_SIZE 件だけをYouTube APIで上書き・先頭追加する。
CONTENTS_BASE_URL = "https://raw.githubusercontent.com/Tawhite23/Tawhite23-toilet-sensei/main/public/data/contents.json"
CONTENTS_TTL_SEC = "300"
CONTENTS_PATCH_SIZE = "30"

# 緊急ブレーキ。"1" にするとサイト側のポーリングが止まる(初回1回だけ取得する)
DISABLED = "0"

# --- AIおトイレ先生（チャット） ---
# IDトークンの検証に使う。Firebaseコンソールのプロジェクト設定と同じ値。
FIREBASE_PROJECT_ID = "otoiresensei-pj"
OPENAI_MODEL = "gpt-4o-mini"
WORKERS_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
# 1人あたりの1日の往復上限
CHAT_DAILY_PER_USER = "20"
# サイト全体の1日の往復上限。これを超えると課金の出るOpenAIは使わず、
# 無料の Workers AI に切り替わる = 月額の最大値がここで決まる。
# 0 にすれば常に無料側だけで動く。
CHAT_DAILY_TOTAL = "500"
CHAT_PHRASES = "お前ら / マジで / やばい / お前らを笑顔に / いや待って"

# YT_API_KEY は [vars] に書かず、必ず secret として登録すること:
#   npx wrangler secret put YT_API_KEY

# セリフ全文検索・名言集のデータベース（エッジのSQLite）。
# 以前は search-index.json(13.6MB→将来97MB見込み)をブラウザが丸ごと
# ダウンロードしていたため、配信本数が増えるほど検索ページが重くなっていた。
# D1に載せてクエリ毎に数KBだけ返す方式へ移行している。
# AIおトイレ先生の受け皿。無料枠に含まれ、サイト全体の1日上限を超えたときや
# OpenAI が落ちているときに自動で切り替わる。
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "otoile-search"
database_id = "2b745cf3-da6c-41b4-93f0-f778346f32d8"

[observability]
enabled = true
